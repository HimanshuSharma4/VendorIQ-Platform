<div style="padding: 24px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <div>
      <h2 style="margin: 0;">Vendor Directory</h2>
      <p style="margin-top: 5px; color: gray;">Overview of all registered vendors securely fetched from the backend.</p>
    </div>
    <button mat-raised-button color="primary" (click)="openAddVendorDialog()">+ Add Vendor</button>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="width: 100%;">
    
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let element"> {{element.vendor_id}} </td>
    </ng-container>

    <ng-container matColumnDef="vendor_name">
      <th mat-header-cell *matHeaderCellDef> Vendor Name </th>
      <td mat-cell *matCellDef="let element"> {{element.vendor_name}} </td>
    </ng-container>

    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef> Category </th>
      <td mat-cell *matCellDef="let element"> {{element.category}} </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let element" style="font-weight: bold;">
        <span [ngStyle]="{'color': element.status === 'Active' ? 'green' : 'red'}">
          {{element.status}}
        </span>
      </td>
    </ng-container>

    <!-- Ye Naya Actions Column Hai -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let element">
        <button mat-button color="primary" (click)="editVendor(element)" style="min-width: auto; padding: 0 8px; font-size: 16px;">✏️</button>
        <button mat-button color="warn" (click)="deleteVendor(element.vendor_id)" style="min-width: auto; padding: 0 8px; font-size: 16px;">🗑️</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
