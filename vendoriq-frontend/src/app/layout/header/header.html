<div class="header-container">
  <div class="page-title">
    <h2>Welcome back, {{ userName.split(' ')[0] }}! 👋</h2>
    <p>Here's the overall platform overview and system statistics.</p>
  </div>

  <div class="header-actions">
    <div class="search-bar">
      <span>🔍</span>
      <input type="text" placeholder="Search anything...">
    </div>
    <div class="icon-btn">🔔</div>
    <div class="icon-btn">📧</div>
    <!-- Real-time dynamic date -->
    <div class="date-display">📅 {{ currentDate | date:'MMM d, yyyy' }}</div>
    <div class="user-profile">
      <!-- User ke naam ka pehla letter -->
      <div class="avatar">{{ userName.charAt(0) | uppercase }}</div>
      <div class="user-info">
        <span class="name">{{ userName }}</span>
        <span class="role">{{ userRole }}</span>
      </div>
    </div>
  </div>
</div>
