<div class="container">
  <!-- Yahan layout change karke button add kiya gaya hai -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <div>
      <h2 style="margin: 0;">User Management</h2>
      <p style="margin-top: 5px; color: gray;">Overview of all registered users and their system roles.</p>
    </div>
    <button mat-raised-button color="primary" (click)="openAddUserDialog()">
      + New User
    </button>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="width: 100%;">
    
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let element"> {{element.id}} </td>
    </ng-container>

    <ng-container matColumnDef="username">
      <th mat-header-cell *matHeaderCellDef> Username </th>
      <td mat-cell *matCellDef="let element"> {{element.username}} </td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef> Role </th>
      <td mat-cell *matCellDef="let element" 
          [ngClass]="element.role === 'Admin' ? 'role-admin' : 'role-user'">
        {{element.role}}
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let element">
        <span *ngIf="element.is_active" style="color: green; font-weight: bold;">Active</span>
        <span *ngIf="!element.is_active" style="color: red; font-weight: bold;">Inactive</span>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
