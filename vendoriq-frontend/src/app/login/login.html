<div class="login-container">
  <!-- Left Side: Branding & Background -->
  <div class="login-left">
    <div class="brand-overlay">
      <div class="logo-circle">V</div>
      <h1>VendorIQ</h1>
      <p>Enterprise Vendor Reliability & Procurement Platform</p>
    </div>
  </div>

  <!-- Right Side: Login Form -->
  <div class="login-right">
    <div class="login-box">
      <h2>Welcome Back! 👋</h2>
      <p class="subtitle">Please sign in to access your dashboard</p>

      <!-- Apna Angular login function yahan connect karein -->
      <form (submit)="onLogin($event)">
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" name="email" [(ngModel)]="email" placeholder="admin@vendoriq.com" required>
        </div>

        <div class="input-group">
          <label>Password</label>
          <input type="password" name="password" [(ngModel)]="password" placeholder="••••••••" required>
        </div>

        <!-- Agar login fail hua toh red error message dikhayega -->
        <p *ngIf="errorMessage" style="color: red; font-size: 13px; margin-bottom: 15px;">{{ errorMessage }}</p>

        <div class="options">
          <label><input type="checkbox"> Remember me</label>
          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="login-btn">Sign In</button>
      </form>
