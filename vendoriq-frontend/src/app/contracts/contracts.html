<div class="container">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <div>
      <h2 style="margin: 0;">Contracts & Compliance</h2>
      <p style="margin-top: 5px; color: gray;">Manage vendor legal agreements and track compliance status.</p>
    </div>
    <!-- YAHAN CHANGE KIYA HAI: (click) event add kar diya -->
    <button mat-raised-button color="primary" (click)="openAddContractDialog()">
      + New Contract
    </button>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="width: 100%;">
    
    <ng-container matColumnDef="contract_number">
      <th mat-header-cell *matHeaderCellDef> Contract No. </th>
      <td mat-cell *matCellDef="let element"> {{element.contract_number}} </td>
    </ng-container>

    <ng-container matColumnDef="vendor_name">
      <th mat-header-cell *matHeaderCellDef> Vendor </th>
      <td mat-cell *matCellDef="let element"> {{element.vendor_name}} </td>
    </ng-container>

    <ng-container matColumnDef="start_date">
      <th mat-header-cell *matHeaderCellDef> Start Date </th>
      <td mat-cell *matCellDef="let element"> {{element.start_date}} </td>
    </ng-container>

    <ng-container matColumnDef="end_date">
      <th mat-header-cell *matHeaderCellDef> End Date </th>
      <td mat-cell *matCellDef="let element"> {{element.end_date}} </td>
    </ng-container>

    <ng-container matColumnDef="compliance_status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let element" 
          [ngClass]="element.compliance_status === 'Valid' ? 'status-valid' : 'status-expired'">
        {{element.compliance_status}}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let element">
        <button mat-button color="warn" (click)="deleteContract(element.id)" style="min-width: auto; padding: 0 8px; font-size: 16px;">
          🗑️
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
