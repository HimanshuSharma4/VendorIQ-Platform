<!-- Main Application Toolbar -->
<mat-toolbar color="primary">
  <span>VendorIQ Management</span>
  <span class="spacer" style="flex: 1 1 auto;"></span> 
  <button mat-button (click)="logout()">Logout</button>
</mat-toolbar>

<!-- Dashboard Content Area -->
<div class="dashboard-container" style="padding: 24px;">
  
  <!-- Header Section with Title and Add Button -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <div>
      <h2 style="margin: 0;">Vendor Directory</h2>
      <p style="margin-top: 5px; color: gray;">Overview of all registered vendors securely fetched from the backend.</p>
    </div>
    
    <!-- Ye Raha Aapka Naya Button -->
    <button mat-raised-button color="primary" (click)="openAddVendorDialog()">
      + Add Vendor
    </button>
  </div>

  <!-- Data Table -->
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="width: 100%;">
    
    <!-- Vendor ID Column -->
    <ng-container matColumnDef="vendor_id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let element"> {{element.vendor_id}} </td>
    </ng-container>

    <!-- Vendor Name Column -->
    <ng-container matColumnDef="vendor_name">
      <th mat-header-cell *matHeaderCellDef> Vendor Name </th>
      <td mat-cell *matCellDef="let element"> {{element.vendor_name}} </td>
    </ng-container>

    <!-- Category Column -->
    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef> Category </th>
      <td mat-cell *matCellDef="let element"> {{element.category}} </td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let element">
        <!-- Status ko thoda highlight karne ke liye bold kiya hai -->
        <strong>{{element.status}}</strong> 
      </td>
    </ng-container>

    <!-- Table Rows Mapping -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
